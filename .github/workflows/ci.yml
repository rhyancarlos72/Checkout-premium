name: CI
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          SKIP_POSTINSTALL_BUILD: '1'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Garante que nenhum segredo foi commitado
        run: |
          ! git ls-files | grep -E '\.(p12|pem|key)$|(^|/)\.env$'
